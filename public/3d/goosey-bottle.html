<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duck bottle 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #DCF1FF;
    --ink: #13306F;
    --ink-soft: #3E5A94;
    --accent: #E8239F;
    --accent-ink: #FFFFFF;
    --duck: #FFC61A;
    --puddle: #7FCDF6;
    --puddle-edge: #A9DEFA;
    --ripple: #FFFFFF;
    --shadow: #0E3A78;
    --pill-bg: rgba(255,255,255,.75);
    --focus: #13306F;
    color-scheme: light;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body { color: var(--ink); font-family: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
  .stage {
    position: relative; width: 100%;
    height: 100%;
    cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none;
    border-radius: 24px;
  }
  .stage.dragging { cursor: grabbing; }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .hint {
    position: absolute; left: 50%; bottom: 1rem; transform: translateX(-50%);
    display: flex; align-items: center; gap: .5rem;
    background: var(--pill-bg); color: var(--ink);
    padding: .45rem .9rem; border-radius: 999px; font-weight: 700; font-size: .9375rem;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    pointer-events: none; transition: opacity .5s ease;
  }
  .hint.gone { opacity: 0; }
  [hidden] { display: none !important; }
  .sleeve-btn {
    position: absolute; top: 1rem; right: 1rem; z-index: 2;
    font: inherit; font-weight: 700; font-size: .9375rem; color: var(--ink);
    background: var(--pill-bg); border: 2px solid color-mix(in srgb, var(--ink) 22%, transparent);
    padding: .5rem 1rem; border-radius: 999px; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: border-color .15s ease, transform .12s ease;
  }
  .sleeve-btn:hover { border-color: var(--ink); }
  .sleeve-btn:active { transform: scale(.97); }
  .sleeve-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .hint svg { width: 20px; height: 20px; flex: none; }
  .fallback { display: none; height: 100%; align-items: center; justify-content: center; }
  .fallback img { max-height: 100%; max-width: 100%; object-fit: contain; }
  .no-webgl .fallback { display: flex; }
  .no-webgl canvas, .no-webgl .hint, .no-webgl .sleeve-btn { display: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
</head>

  // ---------- build one colour of the bottle from its baked photos ----------
  function buildVariant(V, onReady) {
    const META = V.meta, TEX = V.tex;
    // ---------- bottle body from the photo silhouette ----------
    const UNIT = 3.2 / (META.bottom - META.top);

    const prof = META.profile, step = META.profileStep;

      const t = Math.min(Math.max(f - i, 0), 1);

      if (closeTop) pts.push(new THREE.Vector2(0.0001, yOf(list[list.length - 1][0]) + 0.004));

      g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      g.setIndex(idxOuter.concat(idxInner));
      g.addGroup(0, idxOuter.length, 0); g.addGroup(idxOuter.length, idxInner.length, 1);
      return g;
    }
    const sleeve = new THREE.Mesh(buildSleeve(), [
      new THREE.MeshPhysicalMaterial({ map: wrapTex, emissiveMap: wrapTex, emissive: 0xffffff, emissiveIntensity: GLOW,
        roughness: 1, roughnessMap: roughTex, metalness: 0, envMapIntensity: 0.3, side: THREE.DoubleSide }),
      new THREE.MeshPhysicalMaterial({ color: META.sleeveInner, roughness: 0.7, emissive: META.sleeveInner,
        emissiveIntensity: 0.18, envMapIntensity: 0.25, side: THREE.DoubleSide })
    ]);
    sleeve.name = 'sleeve';

    // handle + crown: a real solid traced from the photos, front half wears the front photo, back half the back
    const [cx0, cx1, cy0, cy1] = META.card;
    const cw = cx1 - cx0, ch = cy1 - cy0;
    const cardW = cw * UNIT, cardH = ch * UNIT;
    function toShape(s) {
      const sh = new THREE.Shape(s.outer.map(([x, y]) => new THREE.Vector2(x / cw, 1 - y / ch)));
      for (const h of s.holes) sh.holes.push(new THREE.Path(h.map(([x, y]) => new THREE.Vector2(x / cw, 1 - y / ch))));
      return sh;
    }
    const shapes = META.shapes.map(toShape);
    const DEPTH = 0.05;
    const handleGeo = new THREE.ExtrudeGeometry(shapes, {
      depth: DEPTH, bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.004, bevelSegments: 4, curveSegments: 1 });
    const sideMat = new THREE.MeshPhysicalMaterial({ color: META.sideColor, roughness: 0.32, clearcoat: 0.4,
      clearcoatRoughness: 0.2, emissive: META.sideColor, emissiveIntensity: 0.16, envMapIntensity: 0.38 });
    function capMat(map) {
      return new THREE.MeshPhysicalMaterial({ map, emissiveMap: map, emissive: 0xffffff, emissiveIntensity: GLOW,
        roughness: 0.3, clearcoat: 0.4, clearcoatRoughness: 0.2, envMapIntensity: 0.34 });
    }
    const crown = new THREE.Group();
    const cardX = ((cx0 + cx1) / 2 - META.cx) * UNIT, cardY0 = yOf(cy1);
    for (const [map, flip] of [[frontTex, false], [backTex, true]]) {
      const half = new THREE.Group();
      const m = new THREE.Mesh(handleGeo, [capMat(map), sideMat]);
      m.scale.set(cardW, cardH, 1);
      m.position.set(-cardW / 2, cardY0, 0);
      half.add(m);
      half.position.x = flip ? -cardX : cardX;
      if (flip) half.rotation.y = Math.PI;
      crown.add(half);
    }

    const bottle = new THREE.Group();
    bottle.name = 'bottle';
    bottle.add(body, shell, crown);
    return { bottle, sleeve, BOTTLE_H: yOf(META.top), BASE_R: rows[2][1] * UNIT, LIFT: (META.bottom - waveMin) * UNIT + 0.14 };
  }

  const root = new THREE.Group(), spinner = new THREE.Group();
  root.add(spinner);
  scene.add(root);
  const params = new URLSearchParams(location.search);
  let vi = Math.max(0, VARIANTS.findIndex(v => v.id === params.get('color')));
  const built = buildVariant(VARIANTS[vi], () => start());
  let bottle = built.bottle, sleeve = built.sleeve;
  spinner.add(bottle, sleeve);
  let BOTTLE_H = built.BOTTLE_H, BASE_R = built.BASE_R, LIFT = built.LIFT;

  scene.add(new THREE.HemisphereLight(0xffffff, 0xa9c9f0, 0.26));
  const key = new THREE.DirectionalLight(0xffffff, 0.34); key.position.set(-4, 5, 6); scene.add(key);
  const fill = new THREE.DirectionalLight(0xfff4e0, 0.11); fill.position.set(5, 1, 4); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 0.3); rim.position.set(3, 4, -6); scene.add(rim);

  // ---------- puddle with a reflection, contact shadow, ripples ----------
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function puddleCanvas(mask) {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const g = c.getContext('2d');
    g.translate(256, 256);
    g.filter = mask ? 'none' : 'blur(6px)';
    g.beginPath();
    for (let a = 0; a <= Math.PI * 2 + 0.01; a += 0.05) {
      const r = (mask ? 196 : 205) + 14 * Math.sin(a * 3 + 0.6) + 9 * Math.sin(a * 5 + 2.1) + 6 * Math.sin(a * 8);
      g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    g.closePath();
    if (mask) { g.fillStyle = '#fff'; g.fill(); return c; }
    const grad = g.createRadialGradient(0, 0, 40, 0, 0, 230);
    grad.addColorStop(0, css('--puddle')); grad.addColorStop(1, css('--puddle-edge'));
    g.fillStyle = grad; g.globalAlpha = 0.85; g.fill();
    g.filter = 'blur(2px)'; g.globalAlpha = 0.5;
    g.strokeStyle = css('--ripple'); g.lineWidth = 7; g.lineCap = 'round';
    g.beginPath(); g.arc(0, 0, 175, Math.PI * 1.1, Math.PI * 1.35); g.stroke();
    g.beginPath(); g.arc(0, 0, 150, Math.PI * 1.45, Math.PI * 1.55); g.stroke();
    return c;
  }
  function shadowCanvas() {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    const s = css('--shadow');
    grad.addColorStop(0, s); grad.addColorStop(0.5, s + '99'); grad.addColorStop(1, s + '00');
    g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
    return c;
  }
  const PUDDLE = 4.0;
  const puddleTex = new THREE.CanvasTexture(puddleCanvas()); puddleTex.encoding = THREE.sRGBEncoding;
  const puddle = new THREE.Mesh(new THREE.PlaneGeometry(PUDDLE, PUDDLE),
    new THREE.MeshBasicMaterial({ map: puddleTex, transparent: true, depthWrite: false }));
  puddle.rotation.x = -Math.PI / 2; puddle.position.y = -0.002; puddle.renderOrder = 0; scene.add(puddle); puddle.visible = SHOW_PUDDLE;

  // invisible mask so the reflection only shows inside the water
  const mask = new THREE.Mesh(new THREE.PlaneGeometry(PUDDLE, PUDDLE), new THREE.MeshBasicMaterial({
    map: new THREE.CanvasTexture(puddleCanvas(true)), alphaTest: 0.5, colorWrite: false, depthWrite: false,
    stencilWrite: true, stencilRef: 1, stencilFunc: THREE.AlwaysStencilFunc, stencilZPass: THREE.ReplaceStencilOp }));
  mask.rotation.x = -Math.PI / 2; mask.position.y = -0.003; mask.renderOrder = -1; scene.add(mask); mask.visible = SHOW_PUDDLE;

  const reflRoot = new THREE.Group(); reflRoot.matrixAutoUpdate = false;
  let reflSpinner, reflBottle;
  function rebuildReflection() {
    if (reflSpinner) { reflRoot.remove(reflSpinner); disposeTree(reflSpinner, false); }
    reflSpinner = spinner.clone(true);
    reflSpinner.traverse(o => {
    if (!o.isMesh) return;
    const conv = mat => { const m = mat.clone(); m.transparent = true; m.opacity = (mat.opacity || 1) * 0.42; m.depthWrite = false;
      // fade the reflection out the deeper it goes, like real water
      m.onBeforeCompile = sh => {
        sh.vertexShader = 'varying float vReflY;\n' + sh.vertexShader.replace('#include <project_vertex>',
          '#include <project_vertex>\n vReflY = (modelMatrix * vec4(transformed, 1.0)).y;');
        sh.fragmentShader = 'varying float vReflY;\n' + sh.fragmentShader.replace('#include <output_fragment>',
          '#include <output_fragment>\n gl_FragColor.a *= smoothstep(-0.38, 0.0, vReflY); gl_FragColor.rgb *= 0.8;');
      };
      m.customProgramCacheKey = () => 'reflection';
      m.stencilWrite = true; m.stencilRef = 1; m.stencilFunc = THREE.EqualStencilFunc;
      m.stencilZPass = m.stencilFail = m.stencilZFail = THREE.KeepStencilOp; return m; };
    o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material);
    o.renderOrder = 1;
  });
    reflRoot.add(reflSpinner);
    reflBottle = reflSpinner.getObjectByName('bottle');
  }
  function disposeTree(obj, withGeometry) {
    obj.traverse(o => {
      if (!o.isMesh) return;
      if (withGeometry) o.geometry.dispose();
      for (const m of [].concat(o.material)) {
        if (withGeometry) ['map', 'emissiveMap', 'roughnessMap', 'displacementMap'].forEach(k => m[k] && m[k].dispose());
        m.dispose();
      }
    });
  }
  rebuildReflection();
  scene.add(reflRoot); reflRoot.visible = SHOW_PUDDLE;
  const MIRROR = new THREE.Matrix4().makeScale(1, -1, 1);

  const shadowTex = new THREE.CanvasTexture(shadowCanvas()); shadowTex.encoding = THREE.sRGBEncoding;
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(BASE_R * 3.0, BASE_R * 3.0),
    new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, opacity: 0.6 }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.001; shadow.renderOrder = 2; scene.add(shadow);

  const ripples = [];
  const ringGeo = new THREE.RingGeometry(0.97, 1, 96);
  function ripple(strength) {
    if (reduceMotion || !SHOW_PUDDLE) return;
    const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
      color: new THREE.Color(css('--ripple')), transparent: true, depthWrite: false, opacity: 0 }));
    m.rotation.x = -Math.PI / 2; m.position.y = 0.003; m.renderOrder = 3;
    m.userData = { t: 0, life: 1.5 + strength * 0.4, max: 1.8 + strength * 0.4, s: strength };
    scene.add(m); ripples.push(m);
  }
  function retheme() {
    puddleTex.image = puddleCanvas(); puddleTex.needsUpdate = true;
    shadowTex.image = shadowCanvas(); shadowTex.needsUpdate = true;
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ---------- sizing ----------
  function fitCamera(extra) {
    const H = BOTTLE_H + extra;
    const vHalf = THREE.MathUtils.degToRad(camera.fov / 2);
    let d = (H * 0.5 + 0.34) / Math.tan(vHalf);
    const hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
    d = Math.max(d, 1.5 / Math.tan(hHalf));
    camera.position.set(0, H * 0.5 + d * 0.12, d);
    camera.lookAt(0, H * 0.45, 0);
  }
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    fitCamera(liftNow);
    camera.updateProjectionMatrix();
  }
  // sleeve on/off: the bottle lifts straight up out of its sleeve
  let sleeveOff = 0, sleeveTarget = 0, liftNow = 0;
  const sleeveBtn = document.getElementById('sleeveBtn');
  if (!SHOW_BUTTON) sleeveBtn.hidden = true;
  if (!SHOW_HINT) hint.hidden = true;
  function setSleeve(off) {
    sleeveTarget = off ? 1 : 0;
    if (reduceMotion) sleeveOff = sleeveTarget;
    sleeveBtn.textContent = off ? 'Put the sleeve on' : 'Take the sleeve off';
    sleeveBtn.setAttribute('aria-pressed', off ? 'true' : 'false');
    lastInteract = now();
  }
  sleeveBtn.addEventListener('click', () => setSleeve(sleeveTarget === 0));

  // ---------- colour switching ----------
  const chips = Array.from(document.querySelectorAll('[data-color]'));
  let switchToken = 0;
  function markChips() { chips.forEach(c => c.setAttribute('aria-pressed', c.dataset.color === VARIANTS[vi].id ? 'true' : 'false')); }
  function setColor(id) {
    const i = VARIANTS.findIndex(v => v.id === id);
    if (i < 0 || i === vi) return;
    vi = i; markChips();
    const token = ++switchToken;
    const next = buildVariant(VARIANTS[i], () => {
      if (token !== switchToken) { disposeTree(next.bottle, true); disposeTree(next.sleeve, true); return; }
      spinner.remove(bottle, sleeve); disposeTree(bottle, true); disposeTree(sleeve, true);
      bottle = next.bottle; sleeve = next.sleeve; spinner.add(bottle, sleeve);
      BOTTLE_H = next.BOTTLE_H; BASE_R = next.BASE_R; LIFT = next.LIFT;
      rebuildReflection();
      hop(); if (!reduceMotion) vel += 2.6 * (Math.sign(vel) || 1);
    });
  }
  chips.forEach(c => c.addEventListener('click', () => setColor(c.dataset.color)));
  // a page embedding this can send 'sleeve-off', 'sleeve-on', 'sleeve-toggle' (and 'color-<name>' if the file has several colours)
  window.addEventListener('message', e => {
    if (e.data === 'sleeve-off') setSleeve(true);
    else if (e.data === 'sleeve-on') setSleeve(false);
    else if (e.data === 'sleeve-toggle') setSleeve(sleeveTarget === 0);
    else if (typeof e.data === 'string' && e.data.startsWith('color-')) setColor(e.data.slice(6));
  });
  markChips();
  new ResizeObserver(resize).observe(stage);
  resize();

  // ---------- interaction ----------
  let rotY = -0.45, vel = 0, dragging = false, lastX = 0, lastT = 0, downX = 0, downY = 0;
  let tilt = 0, tiltTarget = 0, leanX = 0, leanZ = 0, leanTX = 0, leanTZ = 0;
  let hover = 0, hoverT = 0, lastInteract = -10, spunOnce = false, spinRippleClock = 0;
  const AUTO = 0.45;
  let hopY = (reduceMotion || !START_DROP) ? 0 : 2.2, hopV = 0, squash = 0, squashV = 0, landed = reduceMotion || !START_DROP;
  const now = () => performance.now() / 1000;
  function hideHint() { if (!spunOnce) { spunOnce = true; hint.classList.add('gone'); } }

  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    dragging = true; stage.classList.add('dragging');
    lastX = downX = e.clientX; downY = e.clientY; lastT = now(); vel = 0;
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    const r = stage.getBoundingClientRect();
    const nx = ((e.clientX - r.left) / r.width) * 2 - 1;
    const ny = ((e.clientY - r.top) / r.height) * 2 - 1;
    if (e.pointerType === 'mouse') { leanTZ = -nx * 0.07; leanTX = ny * 0.05; hoverT = 1; }
    if (!dragging) return;
    const t = now(), dx = e.clientX - lastX, dt = Math.max(t - lastT, 1 / 240), k = 0.011;
    rotY += dx * k;
    vel = vel * 0.6 + (dx * k / dt) * 0.4;
    tiltTarget = THREE.MathUtils.clamp((e.clientY - downY) * 0.0015, -0.16, 0.16);
    lastX = e.clientX; lastT = t; lastInteract = t;
    if (Math.abs(e.clientX - downX) > 6) hideHint();
  });
  function release(e) {
    if (!dragging) return;
    dragging = false; stage.classList.remove('dragging'); tiltTarget = 0; lastInteract = now();
    if (now() - lastT > 0.08) vel = 0;
    const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
    if (moved < 6 && e.type === 'pointerup') hop();
    else if (Math.abs(vel) > 3) ripple(Math.min(Math.abs(vel) / 8, 1));
  }
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  stage.addEventListener('pointerleave', () => { leanTX = leanTZ = 0; hoverT = 0; });
  stage.addEventListener('keydown', e => {
    if (e.target !== stage) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault(); vel += (e.key === 'ArrowRight' ? 1 : -1) * 3.2; lastInteract = now(); hideHint();
    } else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hop(); }
  });
  function hop() { if (reduceMotion || hopY > 0.02) return; hopV = 3.2; landed = false; lastInteract = now(); }

  // ---------- loop ----------
  const clock = new THREE.Clock();
  let started = false;
  function start() { if (started) return; started = true; renderer.setAnimationLoop(frame); }

  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05), t = now();
    if (!dragging) {
      const idle = t - lastInteract;
      if (AUTO_SPIN && !reduceMotion && idle > 2.5) vel += (AUTO - vel) * (1 - Math.exp(-dt * 1.2));
      else vel *= Math.exp(-dt * 2.4);
      rotY += vel * dt;
    }
    spinner.rotation.y = reflSpinner.rotation.y = rotY;

    const sd = sleeveTarget - sleeveOff;
    if (sd !== 0) sleeveOff += Math.sign(sd) * Math.min(Math.abs(sd), dt / 1.1);
    const ease = sleeveOff * sleeveOff * (3 - 2 * sleeveOff);
    liftNow = ease * LIFT;
    bottle.position.y = reflBottle.position.y = liftNow + (reduceMotion ? 0 : Math.sin(t * 2.2) * 0.025 * ease);
    fitCamera(liftNow); camera.updateProjectionMatrix();

    spinRippleClock -= dt;
    if (Math.abs(vel) > 4 && spinRippleClock <= 0 && hopY < 0.01) { ripple(0.25); spinRippleClock = 0.45; }

    if (!landed) {
      hopV -= 14 * dt; hopY += hopV * dt;
      if (hopY <= 0) {
        hopY = 0;
        const impact = -hopV;
        if (impact > 1.2) { ripple(Math.min(impact / 6, 1)); squashV -= impact * 0.06; hopV = impact * 0.28; }
        else { hopV = 0; landed = true; }
      }
    }
    squashV += (-squash * 160 - squashV * 14) * dt;
    squash += squashV * dt;

    tilt += (tiltTarget - tilt) * (1 - Math.exp(-dt * 10));
    leanX += (leanTX - leanX) * (1 - Math.exp(-dt * 6));
    leanZ += (leanTZ - leanZ) * (1 - Math.exp(-dt * 6));
    hover += (hoverT - hover) * (1 - Math.exp(-dt * 6));

    root.position.y = hopY;
    root.rotation.set(leanX + tilt, 0, leanZ);
    const grow = 1 + hover * 0.03;
    root.scale.set(grow * (1 - squash * 0.5), grow * (1 + squash), grow * (1 - squash * 0.5));
    root.updateMatrix();
    reflRoot.matrix.multiplyMatrices(MIRROR, root.matrix);

    const lift = Math.min(hopY / 1.5, 1);
    shadow.scale.setScalar(1 + lift * 0.5);
    shadow.material.opacity = 0.6 * (1 - lift * 0.75);

    for (let i = ripples.length - 1; i >= 0; i--) {
      const m = ripples[i], u = m.userData;
      u.t += dt; const p = u.t / u.life;
      if (p >= 1) { scene.remove(m); m.material.dispose(); ripples.splice(i, 1); continue; }
      const e = 1 - Math.pow(1 - p, 2.2);
      m.scale.setScalar(BASE_R * 1.05 + e * (u.max - BASE_R));
      m.material.opacity = (0.75 * u.s + 0.25) * Math.min(p * 6, 1) * (1 - p);
    }
    renderer.render(scene, camera);
  }
})();
</script>
</body>
</html>
